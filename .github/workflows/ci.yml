name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Run the pipeline
        run: mcu-analytics --out output
      - name: Execute the notebook
        run: jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb notebooks/exploration.ipynb
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: report
          path: |
            output/report.html
            output/tableau/
