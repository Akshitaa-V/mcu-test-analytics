[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-test-analytics"
version = "0.1.0"
description = "Data quality, yield KPIs and SPC for synthetic microcontroller end-of-line test data"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbconvert", "nbformat", "ipykernel"]

[project.scripts]
mcu-analytics = "mcu_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcu_analytics = ["sql/*.sql"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
